[package]
name = "azul-browse"
version = "3.0.0"
edition = "2021"
authors = ["Azul Team"]
description = "A beautiful terminal web browser with AI-powered summaries"

[dependencies]
# TUI Framework (same as Home-dash)
ratatui = "0.28"
crossterm = "0.28"

# HTTP & Web
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.20"
url = "2.5"

# JavaScript rendering (headless Chrome)
headless_chrome = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Database (for bookmarks/history)
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.10"
unicode-width = "0.1"
urlencoding = "2.1"
textwrap = "0.16"

# HTML processing
html2text = "0.12"
ammonia = "4.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
mockito = "1.0"
tempfile = "3.10"
